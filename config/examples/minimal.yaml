# Configuration Minimale SCOUT
# =============================
# La configuration la plus simple possible pour démarrer
# Parfait pour : Tests, développement, apprentissage

providers:
  # Un seul provider configuré
  gemini:
    api_key: "${GEMINI_API_KEY}"
    models:
      # Un seul modèle rapide
      flash:
        id: "gemini-2.0-flash-exp"
        max_tokens: 8192
        temperature: 0.7

teams:
  # Une seule équipe polyvalente
  general:
    description: "Équipe générale pour toutes les tâches"
    primary:
      provider: "gemini"
      model: "flash"
    # Pas de validators pour simplicité

# Pas de mapping spécifique - tout va à l'équipe par défaut
tool_team_mapping: {}

system:
  default_team: "general"
  request_timeout_seconds: 60
  max_retries: 3

# Pas d'intégrations externes
integrations:
  notion_api_key: null
  tavily_api_key: null