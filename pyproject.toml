[project]
name = "scout-mcp-server"
version = "0.1.0"
description = "SCOUT - Strategic CTO Operations and Unified Tooling MCP Server"
authors = [
    {name = "Christian Boulet", email = "christian@bouletstrategies.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    # MCP Protocol
    "fastmcp>=0.5.0",

    # Data Validation & Serialization
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Async HTTP Client
    "httpx>=0.26.0",

    # State Management & Caching
    "redis>=5.0.0",

    # Logging
    "structlog>=23.3.0",

    # Configuration
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",

    # AI Provider SDKs
    "google-generativeai>=0.3.0",
    "openai>=1.10.0",
    "anthropic>=0.8.0",

    # Observability
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",

    # Utilities
    "tenacity>=8.2.3",  # Retry logic
    "aiolimiter>=1.1.0",  # Rate limiting
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.12.0",

    # Code Quality
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",

    # Security
    "bandit>=1.7.6",
    "safety>=3.0.0",
    "detect-secrets>=1.4.0",

    # Documentation
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.5.0",
]

[project.scripts]
scout = "scout.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

# ==============================================================================
# BLACK - Code Formatting
# ==============================================================================
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Default excludes
  \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | _build
  | build
  | dist
)/
'''

# ==============================================================================
# RUFF - Fast Linting
# ==============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # Line too long (handled by black)
    "B008",  # Do not perform function calls in argument defaults
    "C901",  # Too complex (we'll handle this case by case)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports OK in __init__
"tests/**/*.py" = ["ARG", "S101"]  # Unused args and asserts OK in tests

# ==============================================================================
# MYPY - Static Type Checking
# ==============================================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "google.generativeai",
    "anthropic",
    "fastmcp",
    "structlog",
]
ignore_missing_imports = true

# ==============================================================================
# PYTEST - Testing
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",  # Show all test results
    "-v",   # Verbose
    "--strict-markers",
    "--strict-config",
    "--cov=src/scout",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",  # Enforce 80% minimum coverage
]
markers = [
    "asyncio: marks tests as async",
    "benchmark: marks performance benchmark tests",
    "integration: marks integration tests (need real dependencies)",
    "unit: marks unit tests (fully mocked)",
]
# asyncio_mode = "auto"  # Temporarily disabled - will be configured later if needed

# ==============================================================================
# COVERAGE - Test Coverage
# ==============================================================================
[tool.coverage.run]
source = ["src/scout"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ==============================================================================
# BANDIT - Security Linting
# ==============================================================================
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
tests = ["B201", "B301"]
skips = ["B101", "B601"]
