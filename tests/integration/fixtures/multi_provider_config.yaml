# Multi-provider SCOUT configuration for testing provider extensibility
# Tests that multiple AI providers can be configured simultaneously

providers:
  gemini:
    api_key: "sk-test-gemini-key"
    models:
      flash:
        id: "gemini-2.0-flash-exp"
        max_tokens: 8192
        temperature: 0.7
        cost_per_1k_input: 0.0001
        cost_per_1k_output: 0.0003
      pro:
        id: "gemini-2.0-pro-exp"
        max_tokens: 32768
        temperature: 0.5
        cost_per_1k_input: 0.001
        cost_per_1k_output: 0.003

  openai:
    api_key: "sk-test-openai-key"
    models:
      gpt4o:
        id: "gpt-4o"
        max_tokens: 16384
        temperature: 0.7
        cost_per_1k_input: 0.005
        cost_per_1k_output: 0.015

  anthropic:
    api_key: "sk-test-anthropic-key"
    models:
      claude:
        id: "claude-3-5-sonnet-20241022"
        max_tokens: 8192
        temperature: 0.7
        cost_per_1k_input: 0.003
        cost_per_1k_output: 0.015

teams:
  general:
    description: "General-purpose team using Gemini Flash"
    primary:
      provider: "gemini"
      model: "flash"
    validators: []
    use_cases: ["general_queries"]

  analyst:
    description: "Code analysis team using GPT-4o"
    primary:
      provider: "openai"
      model: "gpt4o"
    validators:
      - provider: "anthropic"
        model: "claude"
        trigger: "always"
    use_cases: ["analyze_code", "review_pr"]

tool_team_mapping:
  analyze_code: "analyst"
  general_query: "general"

system:
  default_team: "general"
  request_timeout_seconds: 60
  max_retries: 3
  cache_ttl_seconds: 3600

integrations:
  notion_api_key: null
  tavily_api_key: null
