# SCOUT configuration using environment variable substitution
# This tests ${VAR} and ${VAR:-default} syntax

providers:
  gemini:
    api_key: "${GEMINI_API_KEY}"  # Required env var (no default)
    models:
      flash:
        id: "gemini-2.0-flash-exp"
        max_tokens: 8192
        temperature: 0.7
        cost_per_1k_input: 0.0001
        cost_per_1k_output: 0.0003

teams:
  general:
    description: "General-purpose team"
    primary:
      provider: "gemini"
      model: "flash"
    validators: []
    use_cases: []

tool_team_mapping: {}

system:
  default_team: "${DEFAULT_TEAM:-general}"  # Optional with default
  request_timeout_seconds: 60
  max_retries: 3
  cache_ttl_seconds: 3600
  redis_url: "${REDIS_URL:-null}"  # Optional with default

integrations:
  notion_api_key: "${NOTION_API_KEY:-null}"  # Optional
  tavily_api_key: null
